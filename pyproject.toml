[project]
name = "zylix"
version = "0.1.0"
description = "Aplicación de manipulación de PDFs e imágenes"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "Pillow>=10.0.0",
    "pypdf>=4.0.0",
    "pdf2image>=1.17.0",
    "pytesseract>=0.3.10",
    "scikit-image>=0.22.0",
    "numpy>=1.24.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zylix.ui", "zylix.core", "zylix.utils"]
